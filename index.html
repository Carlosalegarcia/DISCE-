<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f5ef">
  <title>Your language learning plan · Lingo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box }
    body { font-family: "DM Sans", sans-serif }
    h1, h2, .brand { font-family: "Manrope", sans-serif }
    .choice { transition: transform .16s ease, border-color .16s ease, background .16s ease }
    .choice:hover { transform: translateY(-2px) }
    .choice:focus-visible, button:focus-visible, select:focus-visible { outline: 3px solid #a6d38c; outline-offset: 3px }
    #progress-fill { transition: width .35s ease }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important } }
  </style>
</head>
<body class="min-h-screen bg-[#f7f5ef] text-[#17251f] antialiased">
  <div class="mx-auto flex min-h-screen max-w-7xl flex-col px-5 sm:px-8">
    <header class="flex h-[78px] items-center justify-between border-b border-[#e7e5dc]">
      <a class="brand inline-flex items-center gap-2.5 text-[17px] font-extrabold tracking-[-.04em]" href="#" aria-label="Lingo home">
        <span class="grid h-8 w-8 place-items-center rounded-[11px] bg-[#173d31] text-sm text-[#c2e59e]">L</span>lingo<span class="text-[#82a86a]">.</span>
      </a>
      <div class="flex items-center gap-2 text-xs font-semibold text-[#718078]"><span class="h-2 w-2 rounded-full bg-[#91c47c]"></span>Personalized setup</div>
    </header>
    <main class="flex flex-1 flex-col items-center justify-center py-10 sm:py-14">
      <section id="flow" class="w-full max-w-[650px]" aria-live="polite">
        <div class="mb-9">
          <div class="mb-3 flex items-center justify-between text-[11px] font-bold uppercase tracking-[.16em] text-[#768279]">
            <span id="step-label">STEP 1 OF 6</span><span id="progress-percent">17%</span>
          </div>
          <div class="h-[6px] overflow-hidden rounded-full bg-[#e8e9df]" role="progressbar" aria-label="Onboarding progress" aria-valuemin="0" aria-valuemax="6" aria-valuenow="1">
            <div id="progress-fill" class="h-full rounded-full bg-[#6caf58]" style="width:16.67%"></div>
          </div>
        </div>
        <div class="mb-7 text-center">
          <div id="icon" class="mx-auto mb-5 grid h-[58px] w-[58px] place-items-center rounded-2xl bg-[#e8f0e3] text-[26px]" aria-hidden="true"></div>
          <p class="mb-2 text-[11px] font-bold uppercase tracking-[.19em] text-[#6b9c5b]">Your learning plan</p>
          <h1 id="question" class="mx-auto max-w-[590px] text-[27px] font-extrabold leading-tight tracking-[-.045em] sm:text-[34px]"></h1>
          <p id="hint" class="mt-3 text-sm text-[#7a857e]"></p>
        </div>
        <div id="options" class="grid gap-3" aria-label="Answer options"></div>
        <div class="mt-7 flex min-h-11 items-center justify-between">
          <button id="back" class="inline-flex items-center gap-2 rounded-lg px-3 py-2 text-sm font-semibold text-[#66746b] transition hover:bg-[#eeeee6] disabled:invisible" type="button" disabled><span aria-hidden="true">←</span> Back</button>
          <label class="flex items-center gap-2 text-xs text-[#808a82]">Learning
            <select id="learning-language" class="cursor-pointer rounded-md border border-[#dedfd4] bg-white px-2.5 py-1.5 text-xs font-semibold text-[#35443a]" aria-label="Language you are learning">
              <option>German</option><option>Spanish</option><option>French</option><option>Italian</option><option>Portuguese</option><option>Japanese</option><option>Korean</option><option>English</option><option>Other</option>
            </select>
          </label>
        </div>
      </section>
      <section id="summary" class="hidden w-full max-w-[650px]" aria-labelledby="summary-title">
        <div class="mb-8 text-center">
          <div class="mx-auto mb-5 grid h-[62px] w-[62px] place-items-center rounded-2xl bg-[#e8f0e3] text-[27px]" aria-hidden="true">✨</div>
          <p class="mb-2 text-[11px] font-bold uppercase tracking-[.19em] text-[#6b9c5b]">All set</p>
          <h1 id="summary-title" class="text-[30px] font-extrabold tracking-[-.045em] sm:text-[36px]">Your learning profile</h1>
          <p class="mt-3 text-sm text-[#7a857e]">A plan shaped around what works for you.</p>
        </div>
        <div id="summary-card" class="overflow-hidden rounded-2xl border border-[#e6e5dc] bg-white shadow-[0_14px_40px_rgba(31,47,37,.06)]"></div>
        <button id="restart" class="mt-6 w-full rounded-xl border border-[#dfe1d7] bg-white px-5 py-3.5 text-sm font-bold text-[#314238] transition hover:bg-[#f2f4ed]" type="button">Start again</button>
      </section>
    </main>
    <footer class="pb-6 text-center text-[11px] text-[#9aa198]">A little practice every day goes a long way.</footer>
  </div>
  <script>
    (() => {
      const questions = [
        { key: "goal", icon: "✈️", title: () => "What is your primary goal for learning " + language() + "?", hint: "Choose the goal that matters most to you.", options: ["Travel & Culture", "Business & Career Advancement", "Exam Preparation (IELTS, TOEFL, DELE, etc.)", "Daily Conversation & Making Friends", "Moving to a New Country"] },
        { key: "level", icon: "🌱", title: () => "What is your current speaking level?", hint: "Pick the description that feels closest to you.", options: ["Absolute Beginner (I know basic greetings)", "Elementary / Pre-Intermediate (I can construct simple sentences)", "Intermediate (I can handle everyday topics comfortably)", "Advanced (I want to polish fluency and vocabulary)"] },
        { key: "nativeLanguage", icon: "🌍", title: () => "What is your native language?", hint: "This helps your tutor explain things clearly.", type: "select", options: ["English", "Spanish", "French", "German", "Portuguese", "Italian", "Arabic", "Chinese (Mandarin)", "Hindi", "Japanese", "Korean", "Russian", "Other"] },
        { key: "tutorStyle", icon: "💬", title: () => "How would you like your AI tutor to interact with you?", hint: "You can always adjust this later.", options: ["Supportive & Encouraging (Patience-focused)", "Strict & Precise (Focus on instant error correction)", "Casual & Friendly (Peer-to-peer chat style)", "Formal & Professional (Structured instruction)"] },
        { key: "ageGroup", icon: "🧭", title: () => "Which age group do you belong to?", hint: "This helps us tailor examples and topics.", options: ["Under 18", "18–24", "25–34", "35–44", "45–54", "55+"] },
        { key: "dailyPractice", icon: "⏱️", title: () => "How much time can you practice each day?", hint: "Small, consistent sessions make a difference.", options: ["5 minutes / day", "15 minutes / day", "30 minutes / day", "1 hour+ / day"] }
      ];
      const labels = { goal: "Primary goal", level: "Speaking level", nativeLanguage: "Native language", tutorStyle: "Tutor style", ageGroup: "Age group", dailyPractice: "Daily practice" };
      const state = {};
      let current = 0;
      const $ = (id) => document.getElementById(id);
      const language = () => $("learning-language").value;

      function render() {
        const q = questions[current];
        $("step-label").textContent = "STEP " + (current + 1) + " OF " + questions.length;
        $("progress-percent").textContent = Math.round((current + 1) / questions.length * 100) + "%";
        $("progress-fill").style.width = ((current + 1) / questions.length * 100) + "%";
        $("progress-fill").parentElement.setAttribute("aria-valuenow", current + 1);
        $("icon").textContent = q.icon;
        $("question").textContent = q.title();
        $("hint").textContent = q.hint;
        $("back").disabled = current === 0;
        const options = $("options");
        options.replaceChildren();

        if (q.type === "select") {
          const box = document.createElement("div");
          box.className = "rounded-2xl border border-[#dfe2d8] bg-white p-4 shadow-[0_8px_24px_rgba(31,47,37,.04)]";
          const select = document.createElement("select");
          select.className = "w-full cursor-pointer rounded-xl border border-[#e3e5dc] bg-[#fbfcf9] px-4 py-4 text-sm font-semibold text-[#304137]";
          select.setAttribute("aria-label", "Select your native language");
          const placeholder = new Option("Select your native language", "", true, true);
          placeholder.disabled = true;
          select.add(placeholder);
          q.options.forEach((item) => select.add(new Option(item, item)));
          if (state[q.key]) select.value = state[q.key];
          select.addEventListener("change", () => saveAndAdvance(select.value));
          box.append(select);
          options.append(box);
          requestAnimationFrame(() => select.focus({ preventScroll: true }));
          return;
        }

        q.options.forEach((item, index) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "choice group flex w-full items-center gap-4 rounded-2xl border border-[#e3e4db] bg-white px-4 py-3.5 text-left shadow-[0_5px_16px_rgba(31,47,37,.025)] hover:border-[#a9c79a] hover:bg-[#fbfdf9] sm:px-5";
          const number = document.createElement("span");
          number.className = "grid h-9 w-9 shrink-0 place-items-center rounded-xl bg-[#f1f3ed] text-[11px] font-bold text-[#879187] group-hover:bg-[#e8f1e3] group-hover:text-[#477b43]";
          number.textContent = String(index + 1).padStart(2, "0");
          const label = document.createElement("span");
          label.className = "flex-1 text-[13px] font-semibold leading-snug text-[#34433a] sm:text-sm";
          label.textContent = item;
          const arrow = document.createElement("span");
          arrow.className = "text-lg text-[#a2aaa0] group-hover:text-[#56874d]";
          arrow.textContent = "›";
          button.append(number, label, arrow);
          button.addEventListener("click", () => saveAndAdvance(item));
          options.append(button);
        });
      }

      function saveAndAdvance(answer) {
        state[questions[current].key] = answer;
        if (current === questions.length - 1) showSummary();
        else { current += 1; render(); }
      }

      function showSummary() {
        $("flow").classList.add("hidden");
        $("summary").classList.remove("hidden");
        const card = $("summary-card");
        card.replaceChildren();
        const rows = [["Learning language", language()], ...Object.entries(labels).map(([key, label]) => [label, state[key] || "—"])];
        rows.forEach(([label, value], index) => {
          const row = document.createElement("div");
          row.className = "flex items-start justify-between gap-5 px-5 py-4 " + (index === 0 ? "bg-[#f8faf5] " : "") + (index < rows.length - 1 ? "border-b border-[#edf0e8]" : "");
          const name = document.createElement("span");
          name.className = "shrink-0 pt-0.5 text-xs font-medium text-[#89938b]";
          name.textContent = label;
          const answer = document.createElement("strong");
          answer.className = "max-w-[68%] text-right text-[13px] font-semibold leading-snug text-[#2e3d34]";
          answer.textContent = value;
          row.append(name, answer);
          card.append(row);
        });
      }

      $("learning-language").addEventListener("change", () => { if (current === 0) render(); });
      $("back").addEventListener("click", () => { if (current > 0) { current -= 1; render(); } });
      $("restart").addEventListener("click", () => {
        Object.keys(state).forEach((key) => delete state[key]);
        current = 0;
        $("summary").classList.add("hidden");
        $("flow").classList.remove("hidden");
        render();
      });
      render();
    })();
  </script>
</body>
</html>
